<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · NestedFlow</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #000;
        --fg: #f5f5f5;
        --muted: #a3a3a3;
        --line: #262626;
        --accent: #4ba3f7;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #fafafa;
          --fg: #0a0a0a;
          --muted: #525252;
          --line: #e5e5e5;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font:
          16px/1.5 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 22rem;
        text-align: center;
      }
      svg {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        background: var(--fg);
        color: var(--bg);
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#11151f" />
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect
            x="13"
            y="13"
            width="38"
            height="38"
            rx="11"
            stroke="#4ba3f7"
            stroke-opacity="0.35"
            stroke-width="2.5"
          />
          <rect
            x="22"
            y="22"
            width="20"
            height="20"
            rx="6"
            stroke="#4ba3f7"
            stroke-opacity="0.6"
            stroke-width="2.5"
          />
          <path d="M14 44c8 0 10-24 18-24s10 24 18 24" stroke="#4ba3f7" stroke-width="3.5" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>
        NestedFlow needs a connection to show your numbers as they are right now. It will be back as
        soon as you are.
      </p>
      <a href="/today">Try again</a>
    </main>
  </body>
</html>
