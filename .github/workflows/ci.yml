name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://nestedflow:nestedflow@localhost:5432/nestedflow_test
  AUTH_SECRET: ci-secret-at-least-32-characters-long-for-github-actions
  APP_URL: http://127.0.0.1:3100
  TRUST_PROXY_HEADERS: 'false'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nestedflow
          POSTGRES_PASSWORD: nestedflow
          POSTGRES_DB: nestedflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Write env files
        run: |
          cp .env.example .env
          printf 'DATABASE_URL=%s\nAUTH_SECRET=%s\nAPP_URL=%s\nTRUST_PROXY_HEADERS=false\n' \
            "$DATABASE_URL" "$AUTH_SECRET" "$APP_URL" > .env.test

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Unit and integration tests
        run: pnpm test

      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nestedflow
          POSTGRES_PASSWORD: nestedflow
          POSTGRES_DB: nestedflow_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations to the e2e database
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://nestedflow:nestedflow@localhost:5432/nestedflow_e2e

      - run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
